# ============================================================
# pubspec.yaml — additions needed for the Someday test suite
# Merge these blocks into your existing pubspec.yaml
# ============================================================

# Add to the top-level "dependencies" block (already present in your app):
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  drift: ^2.18.0
  supabase_flutter: ^2.5.0
  go_router: ^13.2.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.19.0

# ---------------------------------------------------------------
# ADD these blocks to your pubspec.yaml
# ---------------------------------------------------------------

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Mocking & faking
  mocktail: ^1.0.4

  # Code generation (already in your project, listed for completeness)
  build_runner: ^2.4.11
  freezed: ^2.5.2
  riverpod_generator: ^2.4.3
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0

  # Golden-file / screenshot testing (optional but recommended)
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
