name: someday
description: "Resurrect your abandoned ideas."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Data models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Local storage — encrypted SQLite
  drift: ^2.22.1
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.5
  path: ^1.9.1

  # Secure key storage
  flutter_secure_storage: ^9.2.4

  # Cloud backend
  supabase_flutter: ^2.9.1

  # HTTP
  http: ^1.3.0

  # Voice input
  speech_to_text: ^7.0.0
  permission_handler: ^11.4.0

  # Auth
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^6.2.2

  # Fonts
  google_fonts: ^6.2.1

  # Internationalisation
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

  # Unique ID generation
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5
  freezed: ^3.1.0
  json_serializable: ^6.9.4
  drift_dev: ^2.22.1

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
